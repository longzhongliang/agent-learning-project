[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-v2"
version = "0.1.0"
description = "A modular LangChain Coding Agent learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-chroma>=0.2",
    "langchain-community>=0.3",
    "langchain-deepseek>=1.0",
    "langchain-huggingface>=0.2",
    "langchain-mcp-adapters>=0.1",
    "langchain-text-splitters>=0.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "gradio>=5.0",
    "jieba>=0.42",
    "mcp-server-fetch",
    "modelscope>=1.20",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
]
